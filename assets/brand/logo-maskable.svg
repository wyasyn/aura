      />
      <ellipse cx="69" cy="208" rx="16" ry="13" transform="rotate(-16 69 208)" />

      <use href="#leaf" transform="translate(136,238) rotate(-62) scale(54)" />
      <use href="#leaf" transform="translate(216,283) rotate(-70) scale(46)" />

      <use href="#leaf" transform="translate(264,315) rotate(-49) scale(60)" />
      <use href="#leaf" transform="translate(283,335) rotate(-24) scale(60)" />
      <use href="#leaf" transform="translate(312,345) rotate(-26) scale(48)" />
      <use href="#leaf" transform="translate(290,342) rotate(156) scale(58)" />
      <use href="#leaf" transform="translate(290,343) rotate(139) scale(58)" />
