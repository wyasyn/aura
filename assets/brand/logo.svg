<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aurora Organics">
  <title>Aurora Organics</title>
  <!-- Brand mark: the "A" chevron with a botanical sprig crossing it where a
       crossbar would sit. Source of truth for every generated icon size, see
       scripts/generate-pwa-icons.ts.
       The leaf is a unit shape (base at 0,0, tip at 1,0) placed with
       translate(base) rotate(angle) scale(length). -->
  <defs>
    <path id="leaf" d="M0 0 C.34 -.17 .74 -.17 1 0 C.74 .17 .34 .17 0 0 Z" />
  </defs>

  <circle cx="256" cy="256" r="250" fill="#ff6900" />

  <path
    d="M116 407 L258 78 L400 407"
    fill="none"
    stroke="#111111"
    stroke-width="16"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />

  <g fill="#111111">
    <!-- stem: bud at upper left, running down to a leaf whorl at lower right -->
    <path
      d="M84 213 C 132 224 176 250 210 278 C 244 306 268 326 292 341 C 314 350 334 352 356 352"
      fill="none"
      stroke="#111111"
      stroke-width="7"
      stroke-linecap="round"
    />
    <ellipse cx="69" cy="208" rx="16" ry="13" transform="rotate(-16 69 208)" />

    <!-- leaves along the stem -->
    <use href="#leaf" transform="translate(136,238) rotate(-62) scale(54)" />
    <use href="#leaf" transform="translate(216,283) rotate(-70) scale(46)" />

    <!-- terminal whorl -->
    <use href="#leaf" transform="translate(264,315) rotate(-49) scale(60)" />
    <use href="#leaf" transform="translate(283,335) rotate(-24) scale(60)" />
    <use href="#leaf" transform="translate(312,345) rotate(-26) scale(48)" />
    <use href="#leaf" transform="translate(290,342) rotate(156) scale(58)" />
    <use href="#leaf" transform="translate(290,343) rotate(139) scale(58)" />
  </g>
</svg>
