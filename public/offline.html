<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline | Aurora Organics</title>
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0a09"
    />
    <!--
      Served by public/sw.js when a navigation cannot reach the network, so it
      must be entirely self-contained: no stylesheet, no font, no image
      request. That is why the colours below are raw hex rather than the theme
      tokens in app/globals.css, a stylesheet that is by definition unreachable
      here. The values mirror --background / --foreground / --primary.
    -->
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1c1917;
        --muted: #78716c;
        --brand: #ff6900;
        --border: #e7e5e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --fg: #fafaf9;
          --muted: #a8a29e;
          --border: #292524;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 1.75rem;
        padding: 0.625rem 1.5rem;
        border: 0;
        border-radius: 0.625rem;
        background: var(--brand);
        color: #ffffff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      small {
        display: block;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Inlined copy of assets/brand/logo.svg; keep the two in sync. -->
      <svg viewBox="0 0 512 512" role="img" aria-label="Aurora Organics">
        <defs>
          <path
            id="leaf"
            d="M0 0 C.34 -.17 .74 -.17 1 0 C.74 .17 .34 .17 0 0 Z"
          />
        </defs>
        <circle cx="256" cy="256" r="250" fill="#ff6900" />
        <path
          d="M116 407 L258 78 L400 407"
          fill="none"
          stroke="#111111"
          stroke-width="16"
          stroke-linejoin="miter"
        />
        <g fill="#111111">
          <path
            d="M84 213 C 132 224 176 250 210 278 C 244 306 268 326 292 341 C 314 350 334 352 356 352"
            fill="none"
            stroke="#111111"
            stroke-width="7"
            stroke-linecap="round"
          />
          <ellipse
            cx="69"
            cy="208"
            rx="16"
            ry="13"
            transform="rotate(-16 69 208)"
          />
          <use
            href="#leaf"
            transform="translate(136,238) rotate(-62) scale(54)"
          />
          <use
            href="#leaf"
            transform="translate(216,283) rotate(-70) scale(46)"
          />
          <use
            href="#leaf"
            transform="translate(264,315) rotate(-49) scale(60)"
          />
          <use
            href="#leaf"
            transform="translate(283,335) rotate(-24) scale(60)"
          />
          <use
            href="#leaf"
            transform="translate(312,345) rotate(-26) scale(48)"
          />
          <use
            href="#leaf"
            transform="translate(290,342) rotate(156) scale(58)"
          />
          <use
            href="#leaf"
            transform="translate(290,343) rotate(139) scale(58)"
          />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        Aurora Organics needs a connection to load. Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>Your scans and reports are safe. Nothing was lost.</small>
    </main>
    <script>
      // Reload the moment the connection comes back, so the person does not
      // have to notice and tap.
      addEventListener("online", function () {
        location.reload()
      })
    </script>
  </body>
</html>
